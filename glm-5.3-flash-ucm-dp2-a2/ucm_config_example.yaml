# UCM 配置：Cache|Posix，KV 经主机内存落盘到本地 SSD。
# 两节点都要放到 UCM_CONFIG_FILE 指定位置（默认 /workspace/ucm_config_example.yaml）。
# 想跨节点复用缓存，请把 storage_backends 指向共享文件系统。
# 注意：posix_data_trans_concurrency=1 是 UCM v0.9.0rc3 已知精度问题的规避项
#       （并发 layerwise 读写降精度，issue #1544）；调高会提吞吐但可能掉精度。
ucm_connectors:
  - ucm_connector_name: "UcmPipelineStore"
    ucm_connector_config:
      store_pipeline: "Cache|Posix"
      storage_backends: "/data/ucm/cache"
      io_direct: false
      cache_buffer_capacity_gb: 64
      posix_capacity_gb: 0
      posix_data_trans_concurrency: 1
      use_gdr: false

enable_event_sync: true
use_layerwise: true
enable_record_traces: false
use_lite: false
persist_token_threshold: 0
enable_metrics: true
